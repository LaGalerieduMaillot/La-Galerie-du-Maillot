<script>
const PAYPAL_LINK = "https://paypal.me/Lagaleriedumaillot";
const EMAIL_COMMANDE = "TON_EMAIL_ICI";

const products = [
  {
    name: "Maillot PSG domicile",
    price: 39.99,
    image: "https://via.placeholder.com/300x300?text=Maillot+PSG"
  },
  {
    name: "Maillot Real Madrid",
    price: 39.99,
    image: "https://via.placeholder.com/300x300?text=Real+Madrid"
  },
  {
    name: "Maillot France",
    price: 39.99,
    image: "https://via.placeholder.com/300x300?text=France"
  }
];

let cart = [];

function generateOrderNumber() {
  const random = Math.floor(1000 + Math.random() * 9000);
  return "LGM-" + random;
}

function displayProducts() {
  const list = document.getElementById("productList");
  list.innerHTML = "";

  products.forEach((p, i) => {
    list.innerHTML += `
      <div class="card">
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p class="price">${p.price} €</p>

        <select id="size${i}">
          <option>S</option>
          <option>M</option>
          <option>L</option>
          <option>XL</option>
          <option>XXL</option>
        </select>

        <button class="btn" onclick="addToCart(${i})">
          Ajouter au panier
        </button>
      </div>
    `;
  });
}

function addToCart(index) {
  const size = document.getElementById("size" + index).value;
  cart.push({ ...products[index], size });
  updateCart();
}

function updateCart() {
  const cartList = document.getElementById("cart");
  const total = document.getElementById("total");

  cartList.innerHTML = "";
  let sum = 0;

  cart.forEach((item, index) => {
    sum += item.price;
    cartList.innerHTML += `
      <li>
        ${item.name} - Taille ${item.size} - ${item.price} €
        <button onclick="removeFromCart(${index})">Supprimer</button>
      </li>
    `;
  });

  total.textContent = sum.toFixed(2);
}

function removeFromCart(index) {
  cart.splice(index, 1);
  updateCart();
}

function checkout() {
  if (cart.length === 0) {
    alert("Votre panier est vide.");
    return;
  }

  const orderNumber = generateOrderNumber();
  let total = 0;
  let orderText = "";

  cart.forEach(item => {
    total += item.price;
    orderText += `- ${item.name} | Taille ${item.size} | ${item.price} €%0D%0A`;
  });

  const subject = `Commande ${orderNumber} - La Galerie du Maillot`;

  const body =
    `Bonjour,%0D%0A%0D%0A` +
    `Voici ma commande :%0D%0A%0D%0A` +
    `Numéro de commande : ${orderNumber}%0D%0A%0D%0A` +
    `${orderText}%0D%0A` +
    `Total : ${total.toFixed(2)} €%0D%0A%0D%0A` +
    `J'ai payé ou je souhaite payer via PayPal : ${PAYPAL_LINK}/${total.toFixed(2)}%0D%0A%0D%0A` +
    `Nom :%0D%0A` +
    `Prénom :%0D%0A` +
    `Adresse de livraison :%0D%0A` +
    `Téléphone :%0D%0A%0D%0A` +
    `Merci.`;

  window.open(`${PAYPAL_LINK}/${total.toFixed(2)}`, "_blank");

  setTimeout(() => {
    window.location.href = `mailto:${EMAIL_COMMANDE}?subject=${subject}&body=${body}`;
  }, 1000);

  alert("Ton numéro de commande est : " + orderNumber + ". PayPal va s'ouvrir, puis un mail de commande sera préparé.");
}

function sendMessage(event) {
  event.preventDefault();
  alert("Message envoyé.");
}

displayProducts();
</script>
